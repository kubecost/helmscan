name: Weekly Scan Report

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Two comparisons take ~10 min; fail fast instead of the 6h default if a pull hangs.
    timeout-minutes: 60
    env:
      # ghcr.io rate-limits the Trivy DB download on shared runners; use the ECR mirror.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - run: go build -o helmscan ./cmd/helmscan
      - run: scripts/weekly-report.sh
      - run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmscan-report
          path: out/

      # SLACK_FAILURE_WEBHOOK_URL_PASS/_FAIL are org-level secrets shared across
      # repos (e.g. cherry-pick-checker in kubecost and kubecost-cost-model).
      # They are Slack Workflow Builder triggers taking the string fields
      # workflow, repo, runid, message.
      - name: Send Slack summary
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL_PASS }}
          webhook-type: webhook-trigger
          payload-file-path: out/slack.json
          errors: true

      - name: Send Slack failure alert
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL_FAIL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "workflow": ${{ toJSON(github.workflow) }},
              "repo": ${{ toJSON(github.repository) }},
              "runid": ${{ toJSON(github.run_id) }},
              "message": "Weekly helmscan report failed."
            }
