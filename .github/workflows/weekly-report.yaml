name: Weekly Scan Report

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Two comparisons take ~10 min; fail fast instead of the 6h default if a pull hangs.
    timeout-minutes: 60
    env:
      # `if:` can't read secrets, so expose only whether it's set, not its value.
      SLACK_ENABLED: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # ghcr.io rate-limits the Trivy DB download on shared runners; use the ECR mirror.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - run: go build -o helmscan ./cmd/helmscan
      - run: scripts/weekly-report.sh
      - run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helmscan-report
          path: out/

      # Same pattern as integration-ci-cd / kubecost-cost-model: a Slack Workflow
      # Builder webhook that takes the string fields workflow, run_url, message.
      - name: Send Slack summary
        if: env.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload-file-path: out/slack.json
          errors: true

      - name: Send Slack failure alert
        if: failure() && env.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "workflow": "${{ github.workflow }}",
              "run_url": "${{ env.RUN_URL }}",
              "message": ":rotating_light: Weekly helmscan report failed. Check the run logs."
            }
