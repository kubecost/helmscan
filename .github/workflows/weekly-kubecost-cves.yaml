name: Weekly Kubecost CVE Counts

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Two charts x ~7 images, scanned sequentially.
    timeout-minutes: 60
    env:
      # ghcr.io rate-limits the Trivy DB download on shared runners; use the ECR mirror.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      # helm, yq and jq are preinstalled on ubuntu-latest.
      - run: scripts/weekly-kubecost-cves.sh
      - run: cat out-cves/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubecost-cves
          path: out-cves/

      # Same org-level Slack Workflow Builder triggers as weekly-report.yaml.
      - name: Send Slack summary
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL_PASS }}
          webhook-type: webhook-trigger
          payload-file-path: out-cves/slack.json
          errors: true

      - name: Send Slack failure alert
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_FAILURE_WEBHOOK_URL_FAIL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "workflow": ${{ toJSON(github.workflow) }},
              "repo": ${{ toJSON(github.repository) }},
              "runid": ${{ toJSON(github.run_id) }},
              "message": "Weekly Kubecost CVE count failed."
            }
